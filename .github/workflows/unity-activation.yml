# Unity Personal のライセンスファイル (.ulf) を発行するための手動ワークフロー。
# 手順は docs/ci.md を参照。
name: Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.23f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.filePath }}
          path: ${{ steps.request.outputs.filePath }}
